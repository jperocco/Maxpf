<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxPF Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1712; --panel:#16241C; --panel-2:#1C2E22; --line:#2A3F30;
    --ink:#F2F5EC; --muted:#8FA394; --gold:#E7B92C; --green:#4FA36A;
    --green-bright:#7FD494; --red:#C1442C; --amber:#D98E2A;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.02em;}
  .wrap{max-width:880px; margin:0 auto; padding:26px 18px 70px;}

  header{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:3px solid var(--gold); padding-bottom:12px; margin-bottom:18px; gap:14px; flex-wrap:wrap;}
  .wordmark{font-size:44px; line-height:0.85;}
  .wordmark span{color:var(--gold);}
  .tagline{color:var(--muted); font-size:12px; margin-top:4px; font-weight:500;}

  .controls{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}
  input{background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:9px 11px; border-radius:3px; font-family:'Inter'; font-size:13px;}
  input#userInput{flex:1; min-width:160px;}
  button{font-family:'Inter'; font-weight:700; font-size:13px; border:1.5px solid var(--line); background:var(--panel); color:var(--ink); padding:9px 14px; border-radius:3px; cursor:pointer;}
  button:hover{border-color:var(--gold);}
  button.primary{background:var(--gold); color:#1a1305; border-color:var(--gold);}
  button.primary:hover{background:#f0c548;}
  button:disabled{opacity:0.5; cursor:default;}

  .status{color:var(--muted); font-size:12px; margin-bottom:16px; min-height:16px;}
  .progress-bar-bg{height:5px; background:var(--panel-2); border-radius:3px; overflow:hidden; margin-bottom:8px;}
  .progress-bar-fill{height:100%; background:var(--gold); transition:width .2s;}

  .section-title{font-family:'Bebas Neue'; font-size:24px; letter-spacing:0.02em; margin:26px 0 10px; display:flex; align-items:center; gap:8px;}
  .section-title.top{color:var(--green-bright);}
  .section-title.bottom{color:#e08268;}

  .league-card{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:13px 16px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .league-card.top-card{border-left:3px solid var(--green-bright);}
  .league-card.bottom-card{border-left:3px solid var(--red);}
  .league-info{flex:1; min-width:180px;}
  .league-name{font-weight:700; font-size:14px; margin-bottom:3px;}
  .league-meta{color:var(--muted); font-size:11px;}
  .league-stats{display:flex; gap:18px; align-items:center;}
  .stat{text-align:center;}
  .stat-label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; font-weight:700;}
  .stat-value{font-family:'Bebas Neue'; font-size:22px;}
  .rank-badge{font-family:'Bebas Neue'; font-size:26px; min-width:56px; text-align:center; padding:4px 8px; border-radius:4px;}
  .rank-badge.top{background:rgba(127,212,148,0.15); color:var(--green-bright);}
  .rank-badge.bottom{background:rgba(193,68,44,0.18); color:#e08268;}

  .card-wrap{margin-bottom:8px;}
  .toggle-btn{
    width:100%; text-align:left; background:var(--panel-2); border:1px solid var(--line); border-top:none;
    color:var(--muted); font-size:11px; font-weight:700; padding:6px 16px; cursor:pointer; border-radius:0 0 4px 4px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .toggle-btn:hover{color:var(--gold);}
  .toggle-btn .arrow{transition:transform .15s;}
  .toggle-btn.open .arrow{transform:rotate(180deg);}
  .league-detail{
    display:none; max-height:220px; overflow-y:auto; background:#0B120D; border:1px solid var(--line); border-top:none;
    border-radius:0 0 4px 4px; padding:4px 0;
  }
  .league-detail.open{display:block;}
  .detail-row{display:flex; justify-content:space-between; align-items:center; padding:6px 16px; font-size:12px; border-bottom:1px solid var(--line);}
  .detail-row:last-child{border-bottom:none;}
  .detail-row.has-pick{background:rgba(231,185,44,0.08);}
  .detail-row .drank{color:var(--muted); width:26px; font-weight:700;}
  .detail-row .dname{flex:1; padding:0 8px;}
  .detail-row.has-pick .dname{color:var(--gold); font-weight:700;}
  .detail-row .pick-tag{font-size:10px; color:var(--gold); font-weight:700; margin-left:6px;}
  .detail-row .dppts{font-family:'Bebas Neue'; font-size:15px; width:60px; text-align:right;}
  .detail-row .dfpts{color:var(--muted); font-size:11px; width:60px; text-align:right;}

  .detail-row-grid{
    display:grid; grid-template-columns:2fr 60px 70px 70px 90px; gap:8px;
    padding:7px 8px; font-size:12px; border-bottom:1px solid var(--line); align-items:center;
  }
  .detail-row-grid:last-child{border-bottom:none;}
  .detail-row-grid.has-pick{background:rgba(231,185,44,0.08);}
  .detail-row-grid .cname{display:flex; align-items:center; gap:6px;}
  .detail-row-grid.has-pick .cname{color:var(--gold); font-weight:700;}
  .detail-row-grid .pick-tag{font-size:10px; color:var(--gold); font-weight:700;}
  .detail-row-grid .cmaxpf{font-family:'Bebas Neue'; font-size:15px;}
  .detail-row-grid .cpfreal{color:var(--muted); font-size:12px;}

  .picks-block{padding:10px 16px; border-top:1px solid var(--line);}
  .picks-title{font-size:10px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:700; margin-bottom:6px;}
  .pick-chip{
    display:inline-flex; align-items:center; gap:4px; background:rgba(231,185,44,0.15); color:var(--gold);
    border:1px solid rgba(231,185,44,0.4); border-radius:3px; padding:4px 9px; font-size:12px; font-weight:700;
    margin:0 6px 6px 0;
  }
  .pick-chip .via{color:var(--muted); font-weight:500; font-size:11px;}
  .picks-empty{color:var(--muted); font-size:12px; font-style:italic;}

  table{width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;}
  th{text-align:left; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:0.03em; padding:6px 8px; border-bottom:1px solid var(--line);}
  td{padding:7px 8px; border-bottom:1px solid var(--line);}
  tr:hover td{background:var(--panel-2);}
  .empty-msg{color:var(--muted); font-size:13px; padding:24px 0; text-align:center;}
  details{margin-top:24px; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px 16px;}
  summary{cursor:pointer; font-weight:700; font-size:13px; color:var(--gold);}

  .compact-row-wrap{border-bottom:1px solid var(--line);}
  .compact-row{
    display:grid; grid-template-columns:2fr 60px 70px 70px 90px;
    gap:8px; padding:9px 8px; font-size:12px; cursor:pointer; align-items:center;
  }
  .compact-row:hover{background:var(--panel-2);}
  .compact-row .cname{display:flex; align-items:center; gap:6px;}
  .compact-row .carrow{font-size:9px; color:var(--muted); transition:transform .15s;}
  .compact-row.open .carrow{transform:rotate(180deg); color:var(--gold);}
  .compact-th{
    display:grid; grid-template-columns:2fr 60px 70px 70px 90px; gap:8px;
    padding:6px 8px; font-size:10px; text-transform:uppercase; letter-spacing:0.03em;
    color:var(--muted); font-weight:700; border-bottom:1px solid var(--line);
  }
  .compact-row .league-detail{margin:0 -8px;}
  .error-box{background:rgba(193,68,44,0.12); border:1px solid var(--red); border-radius:4px; padding:12px 14px; font-size:12px; margin-bottom:16px; color:#f0c9c0;}
  footer{margin-top:30px; text-align:center; color:var(--muted); font-size:11px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="wordmark">MAX<span>PF</span> RANKING</div>
      <div class="tagline">onde você é elite e onde tá deixando pontos no banco</div>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="userInput" placeholder="username ou user_id do Sleeper" value="jperocco">
    <input type="text" id="seasonInput" placeholder="temporada" value="2026" style="width:90px;">
    <button class="primary" id="btnLoad">Carregar</button>
    <button id="btnRefresh" style="display:none;">🔄 Atualizar</button>
  </div>

  <div class="status" id="status"></div>
  <div class="progress-bar-bg" id="progressWrap" style="display:none;"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>

  <div id="results"></div>
</div>

<script>
const BASE = 'https://api.sleeper.app/v1';
let lastResults = null;

function statusMsg(msg){ document.getElementById('status').textContent = msg; }

async function resolveUserId(input){
  // If it's already numeric-looking (Sleeper IDs are long numbers), try as user_id first via API anyway,
  // since the /user/{id_or_username} endpoint accepts both.
  const res = await fetch(`${BASE}/user/${encodeURIComponent(input)}`);
  if(!res.ok) throw new Error('Usuário não encontrado no Sleeper: ' + input);
  const data = await res.json();
  if(!data || !data.user_id) throw new Error('Usuário não encontrado no Sleeper: ' + input);
  return data.user_id;
}

async function fetchLeagues(userId, season){
  const res = await fetch(`${BASE}/user/${userId}/leagues/nfl/${season}`);
  if(!res.ok) throw new Error('Falha ao buscar ligas.');
  return res.json();
}

async function fetchRosters(leagueId){
  const res = await fetch(`${BASE}/league/${leagueId}/rosters`);
  if(!res.ok) throw new Error('Falha ao buscar rosters da liga ' + leagueId);
  return res.json();
}

async function fetchUsers(leagueId){
  const res = await fetch(`${BASE}/league/${leagueId}/users`);
  if(!res.ok) throw new Error('Falha ao buscar usuários da liga ' + leagueId);
  return res.json();
}

async function fetchTradedPicks(leagueId){
  const res = await fetch(`${BASE}/league/${leagueId}/traded_picks`);
  if(!res.ok) throw new Error('Falha ao buscar picks trocadas da liga ' + leagueId);
  return res.json();
}

const leagueTeamsMap = {}; // leagueId -> [{name, ppts, fpts, isMe}]
const leaguePicksMap = {}; // leagueId -> [{season, viaName}]  (só as 1as que são minhas)

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function loadAll(){
  const userInput = document.getElementById('userInput').value.trim();
  const season = document.getElementById('seasonInput').value.trim() || '2026';
  if(!userInput){ statusMsg('Digite um username ou user_id.'); return; }

  document.getElementById('btnLoad').disabled = true;
  document.getElementById('results').innerHTML = '';
  statusMsg('Resolvendo usuário...');

  try{
    const userId = await resolveUserId(userInput);
    statusMsg('Buscando suas ligas de ' + season + '...');
    const leagues = await fetchLeagues(userId, season);

    if(!leagues || leagues.length === 0){
      statusMsg('');
      document.getElementById('results').innerHTML = `<div class="empty-msg">Nenhuma liga encontrada pra esse usuário em ${season}.</div>`;
      document.getElementById('btnLoad').disabled = false;
      return;
    }

    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    progressWrap.style.display = 'block';

    const leagueResults = [];
    let done = 0;

    for(const league of leagues){
      statusMsg(`Carregando ${league.name}... (${done+1}/${leagues.length})`);
      try{
        const [rosters, users, tradedPicks] = await Promise.all([
          fetchRosters(league.league_id),
          fetchUsers(league.league_id),
          fetchTradedPicks(league.league_id).catch(() => []), // liga pode não ter picks (best ball etc)
        ]);
        const totalTeams = rosters.length;

        const nameFor = (ownerId) => {
          const u = users.find(u => u.user_id === ownerId);
          if(!u) return 'Time sem dono';
          return (u.metadata && u.metadata.team_name) ? u.metadata.team_name : u.display_name;
        };

        // roster_id -> owner_id, pra achar de quem é cada 1ª do ano seguinte
        const rosterIdToOwnerId = {};
        rosters.forEach(r => { rosterIdToOwnerId[r.roster_id] = r.owner_id; });

        const baseSeason = parseInt(season, 10);
        const targetSeason = String(baseSeason + 1); // sempre a próxima temporada

        // pra cada roster ORIGINAL (1..N), quem é o dono atual da 1ª dele na próxima temporada
        const myPick1stRosterIds = new Set();
        for(let rid = 1; rid <= totalTeams; rid++){
          const trade = tradedPicks.find(p =>
            String(p.season) === targetSeason && p.round === 1 && p.roster_id === rid
          );
          const currentOwnerRosterId = trade ? trade.owner_id : rid;
          const currentOwnerUserId = rosterIdToOwnerId[currentOwnerRosterId];
          if(currentOwnerUserId === userId){
            myPick1stRosterIds.add(rid); // rid = de qual time ORIGINAL essa 1ª saiu
          }
        }

        const withSettings = rosters.filter(r => r.settings);
        const allTeams = withSettings.map(r => {
          const ppts = (r.settings.ppts || 0) + (r.settings.ppts_decimal || 0)/100;
          const fpts = (r.settings.fpts || 0) + (r.settings.fpts_decimal || 0)/100;
          const isMe = r.owner_id === userId || (r.co_owners && r.co_owners.includes(userId));
          const hasMyPick = myPick1stRosterIds.has(r.roster_id); // eu tenho a 1ª que originalmente é desse time
          return { name: nameFor(r.owner_id), ppts, fpts, isMe, hasMyPick };
        }).sort((a,b) => b.ppts - a.ppts);

        const myEntry = allTeams.find(t => t.isMe);

        if(myEntry){
          const rank = allTeams.findIndex(t => t.isMe) + 1;
          leagueTeamsMap[league.league_id] = allTeams;
          leaguePicksMap[league.league_id] = { season: targetSeason };

          leagueResults.push({
            name: league.name,
            leagueId: league.league_id,
            ppts: myEntry.ppts, fpts: myEntry.fpts, rank, totalTeams,
            gap: myEntry.ppts - myEntry.fpts,
          });
        }
      }catch(e){
        console.error('Erro na liga', league.name, e);
      }
      done++;
      progressFill.style.width = (done / leagues.length * 100) + '%';
      await sleep(120); // gentil com a API, evita rajada
    }

    progressWrap.style.display = 'none';
    statusMsg(`${leagueResults.length} de ${leagues.length} ligas carregadas com sucesso.`);

    lastResults = { userId, season, leagueResults, fetchedAt: Date.now() };
    try{
      await window.storage.set('maxpf_last_' + userId + '_' + season, JSON.stringify(lastResults), false);
    }catch(e){ console.warn('Não consegui salvar cache', e); }

    renderResults(leagueResults);
    document.getElementById('btnRefresh').style.display = 'inline-block';

  }catch(err){
    statusMsg('');
    document.getElementById('results').innerHTML = `<div class="error-box">Erro: ${err.message}</div>`;
  }
  document.getElementById('btnLoad').disabled = false;
}

function renderResults(leagueResults){
  if(leagueResults.length === 0){
    document.getElementById('results').innerHTML = '<div class="empty-msg">Nenhum resultado pra mostrar.</div>';
    return;
  }

  const sorted = [...leagueResults].sort((a,b) => a.rank - b.rank);
  const top4 = sorted.slice(0, 4);
  const bottom4 = sorted.slice(-4).reverse();
  const middle = sorted.slice(4, -4);

  const cardHtml = (item, kind) => `
    <div class="card-wrap">
      <div class="league-card ${kind}-card">
        <div class="league-info">
          <div class="league-name">${item.name}</div>
          <div class="league-meta">${item.totalTeams} times · rank ${item.rank}º</div>
        </div>
        <div class="league-stats">
          <div class="stat">
            <div class="stat-label">MaxPF</div>
            <div class="stat-value">${item.ppts.toFixed(1)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">PF real</div>
            <div class="stat-value" style="color:var(--muted); font-size:18px;">${item.fpts.toFixed(1)}</div>
          </div>
          <div class="rank-badge ${kind}">#${item.rank}</div>
        </div>
      </div>
      <button class="toggle-btn" onclick="toggleLeague('${item.leagueId}', this)">
        <span>Ver liga completa (${item.totalTeams} times)</span>
        <span class="arrow">▾</span>
      </button>
      <div class="league-detail" id="detail-${item.leagueId}"></div>
    </div>
  `;

  let html = '';
  html += `<div class="section-title top">🔥 Top 4 — melhor MaxPF relativo</div>`;
  html += top4.map(i => cardHtml(i, 'top')).join('');

  html += `<div class="section-title bottom">💀 Bottom 4 — pior MaxPF relativo</div>`;
  html += bottom4.map(i => cardHtml(i, 'bottom')).join('');

  html += `
    <details>
      <summary>Ver todas as ${leagueResults.length} ligas (ordenadas por rank)</summary>
      <div class="compact-th">
        <span>Liga</span><span>Rank</span><span>MaxPF</span><span>PF real</span><span>No banco</span>
      </div>
      ${sorted.map(i => `
        <div class="compact-row-wrap">
          <div class="compact-row" onclick="toggleCompactRow('${i.leagueId}', this)">
            <span class="cname"><span class="carrow">▾</span>${i.name}</span>
            <span>${i.rank}/${i.totalTeams}</span>
            <span>${i.ppts.toFixed(1)}</span>
            <span>${i.fpts.toFixed(1)}</span>
            <span>${i.gap.toFixed(1)}</span>
          </div>
          <div class="league-detail" id="detail-table-${i.leagueId}"></div>
        </div>
      `).join('')}
    </details>
  `;

  document.getElementById('results').innerHTML = html;
}

async function tryLoadCache(){
  const userInput = document.getElementById('userInput').value.trim();
  const season = document.getElementById('seasonInput').value.trim() || '2026';
  if(!userInput) return;
  try{
    // we don't know the resolved user_id yet without a call, so just attempt with raw input as key guess is unreliable;
    // simplest: skip cache pre-resolve, user clicks "Carregar" once per session.
  }catch(e){}
}

function toggleCompactRow(leagueId, rowEl){
  const detail = document.getElementById('detail-table-' + leagueId);
  const isOpen = detail.classList.contains('open');

  if(!isOpen && detail.innerHTML === ''){
    const teams = leagueTeamsMap[leagueId] || [];
    const pickInfo = leaguePicksMap[leagueId];
    const pickSeason = pickInfo ? pickInfo.season : '';

    detail.innerHTML = teams.map((t, i) => `
      <div class="detail-row-grid ${t.hasMyPick ? 'has-pick' : ''}">
        <span class="cname">${i+1}º ${t.name}${t.isMe ? ' (você)' : ''}${t.hasMyPick ? `<span class="pick-tag">🥇 sua 1ª ${pickSeason}</span>` : ''}</span>
        <span></span>
        <span class="cmaxpf">${t.ppts.toFixed(1)}</span>
        <span class="cpfreal">${t.fpts.toFixed(1)}</span>
        <span></span>
      </div>
    `).join('');
  }

  detail.classList.toggle('open');
  rowEl.classList.toggle('open');
}

function toggleLeague(leagueId, btn){
  const detail = document.getElementById('detail-' + leagueId);
  const isOpen = detail.classList.contains('open');

  if(!isOpen && detail.innerHTML === ''){
    const teams = leagueTeamsMap[leagueId] || [];
    const pickInfo = leaguePicksMap[leagueId];
    const pickSeason = pickInfo ? pickInfo.season : '';

    detail.innerHTML = teams.map((t, i) => `
      <div class="detail-row ${t.hasMyPick ? 'has-pick' : ''}">
        <span class="drank">${i+1}º</span>
        <span class="dname">${t.name}${t.isMe ? ' (você)' : ''}${t.hasMyPick ? `<span class="pick-tag">🥇 sua 1ª ${pickSeason}</span>` : ''}</span>
        <span class="dppts">${t.ppts.toFixed(1)}</span>
        <span class="dfpts">real ${t.fpts.toFixed(1)}</span>
      </div>
    `).join('');
  }

  detail.classList.toggle('open');
  btn.classList.toggle('open');
}

document.getElementById('btnLoad').addEventListener('click', loadAll);
document.getElementById('btnRefresh').addEventListener('click', loadAll);
document.getElementById('userInput').addEventListener('keydown', e => { if(e.key === 'Enter') loadAll(); });
</script>
</body>
</html>
